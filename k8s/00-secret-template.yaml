# DO NOT COMMIT REAL CREDENTIALS.
# Create the secret in Portainer or via kubectl:
#
# kubectl create secret generic muse-voice-secrets \
#   --namespace default \
#   --from-literal=TELEPHONY_PROVIDER="telnyx" \
#   --from-literal=OUTBOUND_CALLER_NUMBER="+15550001234" \
#   --from-literal=TELNYX_API_KEY="KEY019..." \
#   --from-literal=TELNYX_CONNECTION_ID="253..." \
#   --from-literal=TWILIO_ACCOUNT_SID="" \
#   --from-literal=TWILIO_AUTH_TOKEN="" \
#   --from-literal=MCP_API_KEY="$(openssl rand -hex 32)" \
#   --from-literal=WEBHOOK_SIGNING_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: muse-voice-secrets
  namespace: default
type: Opaque
stringData:
  TELEPHONY_PROVIDER: "telnyx"
  OUTBOUND_CALLER_NUMBER: "REPLACE_IN_PORTAINER"
  TELNYX_API_KEY: "REPLACE_IN_PORTAINER"
  TELNYX_CONNECTION_ID: "REPLACE_IN_PORTAINER"
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  MCP_API_KEY: "REPLACE_IN_PORTAINER"
  WEBHOOK_SIGNING_SECRET: "REPLACE_IN_PORTAINER"
