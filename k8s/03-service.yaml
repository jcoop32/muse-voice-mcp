# Internal ClusterIP Service (used by shared cloudflared tunnel -> voice-mcp.cooperlabs.app
# and by in-cluster Muse/Orbit agent pods at http://muse-voice-mcp-svc.default.svc.cluster.local:8090/mcp/sse)
apiVersion: v1
kind: Service
metadata:
  name: muse-voice-mcp-svc
  namespace: default
  labels:
    app: muse-voice-mcp
spec:
  type: ClusterIP
  selector:
    app: muse-voice-mcp
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
---
# External NodePort Service for direct private Tailscale mesh access (http://100.x.y.z:30890/mcp/sse)
apiVersion: v1
kind: Service
metadata:
  name: muse-voice-mcp-tailscale
  namespace: default
  labels:
    app: muse-voice-mcp
spec:
  type: NodePort
  selector:
    app: muse-voice-mcp
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      nodePort: 30890
      protocol: TCP
